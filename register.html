<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Account - Join EduPortal and get started with your student profile.</title>
  <link rel="shortcut icon" href="./assets/img/icon.ico" type="image/x-icon">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Quicksand:wght@300..700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link rel="stylesheet" href="./assets/css/output.css">
</head>

<body class="min-h-screen font-body bg-violet-100 dark:bg-slate-950 text-violet-950 dark:text-violet-50">

  <div class="container mx-auto max-w-2xl p-8">
    <div class="relative flex flex-col gap-2  p-5 rounded-xl bg-white dark:bg-slate-900">
      <button
        class="absolute mode-toggle w-8 h-8 rounded-xl hover:bg-gray-300/60 dark:hover:bg-gray-100/30 hover:scale-105 hover:shadow-2xl dark:shadow-black/40 transition-all font-semibold ">
        <i class="fa-regular fa-moon mode-icon"></i>
      </button>
      <div class="flex flex-col items-center justify-center gap-2">
        <div
          class="w-12 h-12 rounded-xl bg-violet-500 dark:bg-violet-400 flex items-center justify-center text-white font-bold text-xl">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <h1 class="font-heading font-bold text-2xl mb-1">Welcome!</h1>
        <p class="text-gray-500 dark:text-gray-400 mb-6">Sign Up to get your EduPortal account</p>
      </div>
      <form id="logInForm" class="flex flex-col gap-2 w-full mb-3">
        <div class="flex gap-2 w-full">
          <div class="mb-3 flex flex-col gap-2 w-full">
            <label for="name" class="text-sm ml-2 font-bold">Name</label>
            <input id="name" type="text" class="outline-none bg-violet-100 dark:bg-slate-950 p-2 rounded-xl" id="name">
          </div>

          <div class="mb-3 flex flex-col gap-2 w-full">
            <label for="username" class="text-sm ml-2 font-bold">User Name</label>
            <input id="username" type="text" class="outline-none bg-violet-100 dark:bg-slate-950 p-2 rounded-xl"
              id="username">
          </div>
        </div>

        <div class="mb-3 flex flex-col gap-2">
          <label for="emailadress" class="text-sm ml-2 font-bold">Email Address</label>
          <input id="email" type="email" class="outline-none bg-violet-100 dark:bg-slate-950 p-2 rounded-xl"
            id="emailadress">
        </div>

        <div class="mb-3 flex flex-col gap-2">
          <label for="phone" class="text-sm ml-2 font-bold">Phone Number</label>
          <input id="phone" type="text" class="outline-none bg-violet-100 dark:bg-slate-950 p-2 rounded-xl" id="phone">
        </div>

        <div class="mb-3 flex flex-col gap-2">
          <label for="password" class="text-sm ml-2 font-bold">Password</label>
          <input id="password" type="password" class="outline-none bg-violet-100 dark:bg-slate-950 p-2 rounded-xl"
            id="password">
        </div>

        <div class="mb-3 flex flex-col gap-2">
          <label for="usertype" class="text-sm ml-2 font-bold">User Type</label>
          <select id="usertype" class="outline-none bg-violet-100 dark:bg-slate-950 p-2 rounded-xl ext-xs font-bold"
            id="usertype">
            <option value="user" selected>User</option>
            <option value="admin">Admin</option>
          </select>
        </div>

        <button id="loginBtn"
          class="flex justify-center items-center gap-1 w-full px-5 py-3 rounded-xl font-bold text-white bg-violet-500 dark:bg-violet-400 hover:bg-violet-400 dark:hover:bg-violet-500 transition-all ease-in-out duration-300">
          Rigester
          <i class="fa-solid fa-arrow-right-to-bracket"></i></button>
      </form>
      <div class="flex flex-col gap-2">
        <p class="flex gap-1">Already have an account? <a href="#" class="text-violet-500 dark:text-violet-400">Sign
            In</a></p>
      </div>
    </div>
  </div>
  <script src="./assets/js/login.js"></script>
</body>

</html>
